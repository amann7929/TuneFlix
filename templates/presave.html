{% extends "app.html" %}{% block title %}Pre-Save Builder{% endblock %}
{% block body %}<div class="head"><h1 class="pt">Pre-Save Builder</h1></div><div class="two">
<form class="card f" method="post"><h3>New smart link</h3>{{ tk() }}<label>Release</label><select name="release_id" required>{% for r in rels %}<option value="{{ r.id }}">{{ r.title }}</option>{% endfor %}</select><label>Drop date</label><input type="date" name="drop_date"><label>Spotify URL</label><input name="spotify" placeholder="https://"><label>Apple Music URL</label><input name="apple" placeholder="https://"><label>YouTube URL</label><input name="youtube" placeholder="https://"><button class="btn">Create link</button></form>
<div class="card"><h3>Your links</h3>{% for r in rows %}<div style="display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)"><div><b>{{ r.title }}</b><br><a href="/s/{{ r.slug }}" target="_blank" style="color:var(--ac)">{{ request.host_url }}s/{{ r.slug }}</a></div><form method="post" action="/del/presaves/{{ r.id }}">{{ tk() }}<button class="del">Delete</button></form></div>{% else %}<p class="empty">No links yet.</p>{% endfor %}</div></div>{% endblock %}
