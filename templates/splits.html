{% extends "app.html" %}{% block title %}Royalty Splits{% endblock %}
{% block body %}<div class="head"><h1 class="pt">Royalty Splits</h1></div><div class="two">
<form class="card f" method="post"><h3>Add a split</h3>{{ tk() }}<label>Release</label><select name="release_id" required>{% for r in rels %}<option value="{{ r.id }}">{{ r.title }}</option>{% endfor %}</select><label>Collaborator</label><input name="name" required><label>Share (%)</label><input name="pct" type="number" step="0.01" min="0.01" max="100" required><button class="btn">Add split</button></form>
<div class="card"><div class="tw"><table><tr><th>Release</th><th>Collaborator</th><th>Share</th><th></th></tr>{% for r in rows %}<tr><td>{{ r.title }}</td><td>{{ r.name }}</td><td><b>{{ r.pct }}%</b></td><td><form method="post" action="/del/splits/{{ r.id }}">{{ tk() }}<button class="del">Delete</button></form></td></tr>{% else %}<tr><td colspan="4" class="empty">No splits yet.</td></tr>{% endfor %}</table></div></div></div>{% endblock %}
